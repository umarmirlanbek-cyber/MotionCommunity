name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: motion
          POSTGRES_USER: motion
          POSTGRES_PASSWORD: motion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U motion -d motion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-only-not-a-real-secret-key-0123456789
      POSTGRES_DB: motion
      POSTGRES_USER: motion
      POSTGRES_PASSWORD: motion
      POSTGRES_HOST: localhost
    defaults:
      run:
        working-directory: my_site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: my_site/req.txt
      - run: pip install -r req.txt
      - run: python manage.py makemigrations --check
      - run: python manage.py test

  docker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my_site
    steps:
      - uses: actions/checkout@v5
      - name: Write .env
        run: |
          cat > .env <<'EOF'
          SECRET_KEY=ci-only-not-a-real-secret-key-0123456789
          DEBUG=False
          ALLOWED_HOSTS=localhost,web
          POSTGRES_DB=motion
          POSTGRES_USER=motion
          POSTGRES_PASSWORD=motion
          EOF
      - run: docker compose up -d --build --wait --wait-timeout 300
      - run: docker compose exec -T web python manage.py check --deploy --fail-level ERROR
      - name: Check the site through nginx
        run: |
          curl -fsS http://localhost/api/ru/health/
          curl -fsS -o /dev/null http://localhost/api/ru/choices/
          docker compose exec -T web sh -c 'mkdir -p media/task_files media/team_image && echo x > media/task_files/x.png && echo x > media/team_image/x.png'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/media/task_files/x.png)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/media/team_image/x.png)" = 200
          for i in $(seq 1 20); do curl -s -o /dev/null -w '%{http_code}\n' http://localhost/admin/login/; done | grep -q 429
          head -c 30000000 /dev/zero > /tmp/big.bin
          test "$(curl -s -o /dev/null -w '%{http_code}' -F file=@/tmp/big.bin http://localhost/api/ru/projects/1/tasks/1/attachments/)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -F file=@/tmp/big.bin http://localhost/api/ru/projects/)" = 413
      - name: Check a task file goes through nginx only by a signed link
        run: |
          URL=$(docker compose exec -T web python manage.py shell -v 0 -c "
          from django.core.files.base import ContentFile
          from motion_app.models import Project, Task, TaskAttachment
          from motion_app.services import task_file_url
          task = Task.objects.create(project=Project.objects.create(name='CI', description='d', category='c'), title='CI')
          attachment = TaskAttachment(task=task)
          attachment.file.save('ci.txt', ContentFile(b'ci-file'))
          print(task_file_url(attachment))
          print(attachment.file.name)" | tail -2)
          LINK=$(echo "$URL" | head -1)
          NAME=$(echo "$URL" | tail -1)
          test "$(curl -fsS http://localhost$LINK)" = ci-file
          curl -fsS -D - -o /dev/null http://localhost$LINK | grep -qi 'content-disposition: attachment'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/private/$NAME)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/media/$NAME)" = 404
      - if: failure()
        run: docker compose logs
