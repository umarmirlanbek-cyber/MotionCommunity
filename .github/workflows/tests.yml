name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: motion
          POSTGRES_USER: motion
          POSTGRES_PASSWORD: motion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U motion -d motion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-only-not-a-real-secret-key-0123456789
      POSTGRES_DB: motion
      POSTGRES_USER: motion
      POSTGRES_PASSWORD: motion
      POSTGRES_HOST: localhost
    defaults:
      run:
        working-directory: my_site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: my_site/req.txt
      - run: pip install -r req.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test
